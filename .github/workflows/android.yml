name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest ships with the Android SDK (ANDROID_HOME is preset)
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3

      - name: Install dependencies
        run: npm ci

      - name: Add Bible API keys
        env:
          NLT_API_KEY: ${{ secrets.NLT_API_KEY }}
          ESV_API_KEY: ${{ secrets.ESV_API_KEY }}
        run: |
          printf "export const NLT_KEY = '%s';\nexport const ESV_KEY = '%s';\n" "$NLT_API_KEY" "$ESV_API_KEY" > www/js/config.js
          [ -n "$NLT_API_KEY" ] && echo "NLT key added" || echo "::warning::NLT_API_KEY secret not set"
          [ -n "$ESV_API_KEY" ] && echo "ESV key added" || echo "ESV_API_KEY secret not set (optional)"

      - name: Create Android project
        run: |
          npx cap add android
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#1f44c4' --iconBackgroundColorDark '#1f44c4' \
            --splashBackgroundColor '#1f44c4' --splashBackgroundColorDark '#1f44c4'
          npx cap sync android
          # Daily reminders don't need exact alarms; drop the permission so
          # Play doesn't require an exact-alarm declaration.
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          if 'xmlns:tools' not in s:
              s = s.replace('<manifest ', '<manifest xmlns:tools="http://schemas.android.com/tools" ', 1)
          s = s.replace('</manifest>', '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" tools:node="remove" />\n</manifest>')
          open(p, 'w').write(s)
          PY

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          # A fixed signing key lets each new APK install over the previous one
          # without losing your reading progress. If no secret is set, a key is
          # created and the build still works (but updates may need a reinstall).
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/lamp.keystore
          else
            keytool -genkeypair -v -keystore android/app/lamp.keystore -alias lamp \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass lamp-devotions -keypass lamp-devotions \
              -dname "CN=Lamp, O=Lykadoodles, C=PH"
          fi

      # Keep Gradle and its downloads between builds, so a GitHub download
      # outage can't block a build once these are cached.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      # Gradle's own download now lives on GitHub releases; if those are timing
      # out, fetch the same Gradle zip from a mirror instead.
      - name: Choose where to download Gradle from
        working-directory: android
        run: |
          P=gradle/wrapper/gradle-wrapper.properties
          URL=$(grep distributionUrl $P | cut -d= -f2- | sed 's#\\:#:#g')
          ZIP=$(basename "$URL")
          echo "Gradle: $URL"
          if ls ~/.gradle/wrapper/dists/*/*/"$ZIP" >/dev/null 2>&1 || curl -sfL -r 0-0 --max-time 30 -o /dev/null "$URL"; then
            echo "Using the usual Gradle download (or the cache)"
          else
            for M in "https://mirrors.cloud.tencent.com/gradle/$ZIP" "https://mirrors.aliyun.com/gradle/distributions/$ZIP"; do
              if curl -sfL -r 0-0 --max-time 30 -o /dev/null "$M"; then
                echo "GitHub download unavailable; using mirror $M"
                sed -i "s#^distributionUrl=.*#distributionUrl=$(echo "$M" | sed 's#:#\\\\:#')#" $P
                break
              fi
            done
            # Maven Central hands some big files (like the Kotlin compiler) to GitHub
            # storage too; read libraries from Google's full copy of Maven Central instead.
            mkdir -p ~/.gradle/init.d
            cat > ~/.gradle/init.d/central-mirror.gradle <<'GRADLE'
          def MIRROR = 'https://maven-central.storage-download.googleapis.com/maven2/'
          def useMirror = { repos ->
            repos.configureEach { r ->
              if (r instanceof MavenArtifactRepository && r.url.toString().startsWith('https://repo.maven.apache.org/maven2')) r.url = MIRROR
            }
          }
          beforeSettings { s -> useMirror(s.pluginManagement.repositories); useMirror(s.dependencyResolutionManagement.repositories) }
          allprojects { useMirror(buildscript.repositories); useMirror(repositories) }
          GRADLE
            echo "Libraries: Google's Maven Central mirror"
          fi
          grep distributionUrl $P

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cat >> app/build.gradle <<'GRADLE'

          android {
              defaultConfig {
                  versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
                  versionName "1.0." + (System.getenv("VERSION_CODE") ?: "1")
              }
              signingConfigs {
                  lamp {
                      storeFile file("lamp.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD") ?: "lamp-devotions"
                      keyAlias System.getenv("KEY_ALIAS") ?: "lamp"
                      keyPassword System.getenv("KEYSTORE_PASSWORD") ?: "lamp-devotions"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.lamp
                      minifyEnabled false
                  }
              }
          }
          GRADLE
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../Lamp.apk
          cp app/build/outputs/bundle/release/app-release.aab ../Lamp.aab

      - uses: actions/upload-artifact@v4
        with:
          name: Lamp-builds
          path: |
            Lamp.apk
            Lamp.aab

      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Lamp.apk Lamp.aab \
            --title "Lamp (build ${{ github.run_number }})" \
            --notes "**Lamp.apk**: install directly on an Android phone. **Lamp.aab**: upload to Google Play Console. Built from ${GITHUB_SHA::7}." \
            --latest

      # Builds from other branches (run by hand from the Actions tab) go to a
      # separate "preview" pre-release, so testing a branch never replaces the
      # APK everyone downloads from "latest".
      - name: Publish to the "preview" pre-release
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete preview --yes --cleanup-tag || true
          gh release create preview Lamp.apk \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Lamp preview: ${GITHUB_REF_NAME} (build ${{ github.run_number }})" \
            --notes "Test build from the **${GITHUB_REF_NAME}** branch (${GITHUB_SHA::7}). Installs over your current Lamp and keeps your progress."
